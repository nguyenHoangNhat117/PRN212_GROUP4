name: Database validation
on:
  pull_request:
  push:
    branches: [main, fix/database-runtime-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check generated installers
        run: |
          python3 scripts/Sync-DatabaseInstaller.py
          python3 scripts/Build-DatabasePackages.py
          git diff --exit-code -- Database
      - name: Build application and tests
        run: dotnet build --nologo
      - name: Build account bootstrap
        run: dotnet build tools/AccountBootstrap --nologo
      - name: SQL regression, bootstrap and backup restore
        run: python3 scripts/Verify-DatabaseRuntime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
